appId: com.crazyymister.tce
productName: Total College Experience
copyright: Copyright (C) Venus Dev (Venus University); Copyright (C) CrazyyMister (Total College Experience)
directories:
  output: release
  buildResources: build

# `out` is the whole app; the renderer's own copies of React and the fonts are
# already bundled into it, and main's only externals are 7zip-bin, node-7z and
# @electron-toolkit/utils.
files:
  - out/**/*
  - package.json
  - '!**/*.{map,ts,tsx,md}'
  - '!node_modules/@fontsource/**'
  - '!node_modules/{react,react-dom,scheduler,motion,motion-dom,motion-utils,framer-motion,zustand,signalsmith-stretch}/**'
  - '!node_modules/7zip-bin/{linux,mac}/**'

asar: true
# archiveService spawns 7za off __dirname, which has to be a real path.
asarUnpack:
  - '**/node_modules/7zip-bin/**'

# The WebP cast, the pose manifest, the workflows and the sound, where
# `getAssetsPath()` looks for them when the app is packaged. No backgrounds:
# the renderer bundles those itself.
extraResources:
  - from: build/desktop-assets
    to: assets

# The licence and permission texts and the README, beside the exe where a player unzipping the
# folder finds them. The logo is the README's picture.
extraFiles:
  - LICENSE
  - LICENSE-ASSETS.md
  - NOTICE
  - PERMISSION.md
  - README.md
  - from: docs/tce_logo.svg
    to: docs/tce_logo.svg

npmRebuild: false
compression: normal

win:
  icon: build/icon.ico
  target:
    - target: dir
      arch: [x64]
  # The game writes `data/` beside its own exe; asking for elevation would be
  # both a lie and a UAC prompt on every launch.
  requestedExecutionLevel: asInvoker
