<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Venus University: Total College Experience, an unofficial mod by CrazyyMister">
  <!-- Colours: the game's wine and rose. Hard offset shadows, never blurs, like the game's paper layer. -->
  <defs>
    <style>
      .wine   { fill: #9b2e52; }
      .deep   { fill: #4a1427; }
      .rose   { fill: #f6c9d6; }
      .cream  { fill: #fff5f7; }
      .disp   { font-family: "Georgia", "Times New Roman", serif; font-style: italic; font-weight: 700; }
      .mono   { font-family: "Consolas", "Courier New", monospace; font-weight: 700; letter-spacing: 6px; }
    </style>
  </defs>

  <g transform="rotate(-2 480 210)">
    <!-- Card: hard shadow, then the face -->
    <rect x="40" y="40" width="880" height="330" rx="48" class="deep"/>
    <rect x="28" y="28" width="880" height="330" rx="48" class="cream" stroke="#9b2e52" stroke-width="6"/>

    <!-- The hare mark (the game's bunny path) in an archway -->
    <g transform="translate(70 95)">
      <path d="M8 200 V95 A75 75 0 0 1 158 95 V200 Z" class="deep" transform="translate(8 8)"/>
      <path d="M8 200 V95 A75 75 0 0 1 158 95 V200 Z" class="wine"/>
      <g transform="translate(11 52) scale(6)" fill="none" stroke="#fff5f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 21 V15 A5 5 0 0 1 8.5 10 V5 A2 2 0 0 1 12.5 5 V10 H15 A5.5 5.5 0 0 1 16.5 10.21 V5 A2 2 0 0 1 20.5 5 V15.5 A5.5 5.5 0 0 1 15 21 Z"/>
      </g>
    </g>

    <!-- Small line over the title -->
    <text x="270" y="105" class="mono wine" font-size="24">VENUS UNIVERSITY</text>

    <!-- Title, with a hard offset copy behind it -->
    <g class="disp" font-size="78">
      <text x="276" y="191" class="rose">Total College</text>
      <text x="270" y="185" class="wine">Total College</text>
      <text x="276" y="273" class="rose">Experience</text>
      <text x="270" y="267" class="wine">Experience</text>
    </g>

    <!-- The unofficial pill -->
    <g transform="translate(270 296)">
      <rect x="6" y="6" width="560" height="46" rx="23" class="deep"/>
      <rect x="0" y="0" width="560" height="46" rx="23" class="wine"/>
      <text x="280" y="31" text-anchor="middle" class="mono cream" font-size="19" letter-spacing="4">UNOFFICIAL MOD · BY CRAZYYMISTER</text>
    </g>

    <!-- Two sparkles -->
    <path d="M860 70 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" class="wine"/>
    <path d="M872 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" class="rose" stroke="#9b2e52" stroke-width="2"/>
  </g>
</svg>
